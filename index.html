    <!-- ReactDOM -->

    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<body>
    <!-- Contenedor React -->
    <div id="root"></div>

    <script type="text/babel">

        function Contador() {
            const [contar, setContar] = React.useState(0);

            // Efecto 1: Actualiza el título del documento cuando cambia `contar`

            React.useEffect(() => {
                document.title = `Diste un click ${contar} veces`;
            }, [contar]);

            // Efecto 2: Timer con limpieza (cleanup) al desmontar

            React.useEffect(() => {
                const id = setInterval(() => {
                    console.log('message');
                }, 2000);

                return () => {
                    clearInterval(id);
                };  

            }, []);

            return (
                <div>
                    <h1>{contar}</h1>
                    <button onClick={() => setContar(contar + 1)}>CLICK AQUÍ</button>
                </div>
            );
        }
        // Correr pagina con ReactDOM.render

        ReactDOM.render(<Contador />, document.getElementById('root'));


    </script>
</body>

</html>
